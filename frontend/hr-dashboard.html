<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FlowSpherePro - HR Dashboard</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <div class="app-layout">

        <aside class="sidebar" id="sidebar">
            <div class="sidebar-brand">
                <div class="logo-mark">FSP</div>
                <span>FlowSpherePro</span>
            </div>

            <nav class="sidebar-nav">
                <a href="#queue-section" class="active"><span class="icon">&#9632;</span> Pending Reviews</a>
            </nav>

            <button id="logout-btn" class="btn-logout">&#8592; Log Out</button>
        </aside>

        <div class="main">
            <header class="topbar">
                <button class="menu-toggle" id="menu-toggle">&#9776;</button>
                <div>
                    <h1>Welcome back, <span id="user-name">...</span></h1>
                    <div class="welcome-sub">Documents waiting for HR review</div>
                </div>
                <div class="topbar-right">
                    <span class="role-badge">HR</span>
                </div>
            </header>

            <main class="content">

                <section class="stats-grid">
                    <div class="stat-card accent-warning">
                        <div class="stat-label">Pending Reviews</div>
                        <div class="stat-value" id="stat-pending">0</div>
                    </div>
                </section>

                <section id="queue-section" class="card">
                    <h2>Documents Awaiting HR Review</h2>
                    <div id="pending-body" class="documents-list">
                        <p class="empty-state">Loading...</p>
                    </div>
                </section>

            </main>
        </div>
    </div>

    <script src="js/hr-dashboard.js"></script>
</body>
</html>
